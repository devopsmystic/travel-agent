plugins {
    id 'org.springframework.boot' version '3.3.0'
    id 'io.spring.dependency-management' version '1.1.4'
    id 'java'
}

group = 'travel'
version = '1.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

compileJava.options.compilerArgs += ['-parameters']

springBoot {
    mainClass = 'travel.agent.TravelAgentApplication'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.google.adk:google-adk:1.0.0-rc.1'
    implementation 'com.google.adk:google-adk-dev:1.0.0-rc.1'
    implementation 'io.github.cdimascio:dotenv-java:3.0.0'
}

bootRun {
    environment 'GOOGLE_GENAI_USE_VERTEXAI', 'TRUE'
    environment 'GOOGLE_CLOUD_PROJECT', 'smart-assist-492607'
    environment 'GOOGLE_CLOUD_REGION', 'us-central1'
}